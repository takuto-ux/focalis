<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004a39"/>
      <stop offset="1" stop-color="#0a8a67"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#d9f99d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- focal point: wavefronts from the element row converge to one point -->
  <circle cx="32" cy="22" r="10" fill="url(#glow)"/>
  <path d="M14 47 Q32 30 50 47" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M19 40 Q32 27 45 40" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M24 33 Q32 25 40 33" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="22" r="3.6" fill="#bef264"/>
  <!-- non-uniform element row -->
  <g fill="#bef264">
    <circle cx="12" cy="53" r="2.2"/><circle cx="19" cy="53" r="2.2"/><circle cx="24" cy="53" r="2.2"/>
    <circle cx="33" cy="53" r="2.2"/><circle cx="37" cy="53" r="2.2"/><circle cx="45" cy="53" r="2.2"/>
    <circle cx="52" cy="53" r="2.2"/>
  </g>
</svg>
